# Fake cameras for local dev and e2e (docker-compose.mock.yml).
# Mirrors the real camera host: HLS at :8888/<cam>/index.m3u8 (what /api/stream/ proxies and
# fetch_recordings records) and the WebRTC viewer page at :8889/<cam> (Camera.live_url).
#
# Cheap by design: a camera's ffmpeg only runs while someone is watching or recording it
# (runOnDemand), at 640x360/10fps with ultrafast x264, so an idle mock stack uses ~0% CPU.
logLevel: warn

rtsp: yes
rtspAddress: :8554
rtmp: no
srt: no

# Only used by the container healthcheck (doesn't wake any camera).
api: yes
apiAddress: :9997

hls: yes
hlsAddress: :8888
# Plain MPEG-TS segments: no LL-HLS query strings, which the /api/stream/ path allowlist rejects.
hlsVariant: mpegts
hlsSegmentDuration: 2s
hlsAllowOrigin: "*"

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: [127.0.0.1]

# Video only (H.264): browsers can't play AAC over WebRTC, and fetch_recordings copes with no
# audio track. $MTX_PATH is the camera name; each path picks its own test pattern.
pathDefaults:
  runOnDemandStartTimeout: 15s
  runOnDemandCloseAfter: 15s

paths:
  cam1:
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -re -f lavfi -i testsrc2=size=640x360:rate=10
      -c:v libx264 -preset ultrafast -tune zerolatency -g 20 -pix_fmt yuv420p
      -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
  cam2:
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -re -f lavfi -i smptehdbars=size=640x360:rate=10
      -c:v libx264 -preset ultrafast -tune zerolatency -g 20 -pix_fmt yuv420p
      -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
  cam3:
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -re -f lavfi -i testsrc=size=640x360:rate=10
      -c:v libx264 -preset ultrafast -tune zerolatency -g 20 -pix_fmt yuv420p
      -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
